<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .compliment-pill { padding: 20px; background: white; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="compliment-pill">Click me</div>
  <script>
    document.querySelectorAll('.compliment-pill').forEach((pill) => {
      pill.addEventListener('click', (e) => {
        // Mini confetti burst
        for(let i = 0; i < 8; i++) {
          const heart = document.createElement('div');
          heart.innerText = ['💖', '✨', '🌸', '⭐'][Math.floor(Math.random()*4)];
          heart.style.position = 'fixed';
          heart.style.left = e.clientX + 'px';
          heart.style.top = e.clientY + 'px';
          heart.style.fontSize = (Math.random() * 10 + 12) + 'px';
          heart.style.pointerEvents = 'none';
          heart.style.zIndex = '9999';
          heart.style.transition = 'all 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
          
          const angle = Math.random() * Math.PI * 2;
          const velocity = Math.random() * 30 + 20;
          const tx = Math.cos(angle) * velocity;
          const ty = Math.sin(angle) * velocity - 20; // upward bias
          
          document.body.appendChild(heart);
          
          // Force reflow so the transition works
          void heart.offsetWidth;
          
          heart.style.transform = `translate(${tx}px, ${ty}px) scale(1.5)`;
          heart.style.opacity = '0';
          
          setTimeout(() => heart.remove(), 800);
        }
      });
    });
  </script>
</body>
</html>
